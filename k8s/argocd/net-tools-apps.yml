apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: net-tools-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/mannyi-nv/net-tools-ci-kubernetes.git'
    targetRevision: HEAD
    path: deploy
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: apps
  syncPolicy:
    syncOptions:
      - CreateNamespace=true