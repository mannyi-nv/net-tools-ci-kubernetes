apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: jenkins
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      serviceAccountName: jenkins
      securityContext:
        fsGroup: 1000
      initContainers:
      - name: install-plugins
        image: jenkins/jenkins:lts-jdk17
        command:
        - jenkins-plugin-cli
        args:
        - --plugins
        - kubernetes
        - configuration-as-code
        - workflow-aggregator
        - git
        - github
        - credentials-binding
        - --plugin-download-directory
        - /var/jenkins_home/plugins
        volumeMounts:
        - name: jenkins-store
          mountPath: /var/jenkins_home
      containers:
      - name: jenkins
        image: jenkins/jenkins:lts-jdk17
        env:
        - name: CASC_JENKINS_CONFIG
          value: /var/jenkins_config/jenkins.yaml
        ports:
        - containerPort: 8080
          name: web
        - containerPort: 50000
          name: agent
        volumeMounts:
        - name: jenkins-store
          mountPath: /var/jenkins_home
        - name: jenkins-config
          mountPath: /var/jenkins_config
          readOnly: true
      volumes:
      - name: jenkins-store
        persistentVolumeClaim:
          claimName: jenkins-pvc
      - name: jenkins-config
        configMap:
          name: jenkins-config
---
apiVersion: v1
kind: Service
metadata:
  name: jenkins-service
  namespace: jenkins
spec:
  type: NodePort
  selector:
    app: jenkins
  ports:
  - name: web
    port: 8080
    targetPort: 8080
    nodePort: 30080
  - name: agent
    port: 50000
    targetPort: 50000
