apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-config
  namespace: jenkins
data:
  jenkins.yaml: |
    jenkins:
      clouds:
        - kubernetes:
            name: "minikube"
            namespace: "jenkins"
            serverUrl: "https://kubernetes.default.svc"
            jenkinsUrl: "http://jenkins-service.jenkins.svc.cluster.local:8080"
            jenkinsTunnel: "jenkins-service.jenkins.svc.cluster.local:50000"
            containerCapStr: "10"
